<div class="row">
  <div class="col-6">
    <app-liste (eventToCv)="recupererCandidat($event)" ></app-liste>
  </div>
  <div class="col-6">
    @if (selCand) {
      <app-details [selectedCandidate]="selCand"></app-details>
    } @else {
      <p>Veuillez selectionner un candidat</p>
    }
  </div>
</div>

<button (click)="addCandidate()" class="btn btn-info">Add Candidate</button>
<button (click)="showCandidatesList()" class="btn btn-dark">Cv's View</button>
