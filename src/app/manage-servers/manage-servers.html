<input [(ngModel)]="inputStatus" type="text" class="form-control">

<ol class="list-group">
    @for (server of allServers | filter:inputStatus; track $index) {
        
        <li [ngClass]="affecterClasse(server.status)" class="list-group-item">
            {{ server.name | short:10 }} | 
            {{ server.type | titlecase}} | 
            {{ server.date_d | date:'fullDate' | uppercase}} 
            <span class="badge text-bg-secondary">{{ server.status }} </span>
        </li>
    }
</ol>
<button (click)="addServer()" class="btn btn-primary">Add Server</button>
