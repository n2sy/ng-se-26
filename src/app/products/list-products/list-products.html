<table class="table table-striped">
    <thead>
        <th>ID</th>
        <th>Product Name</th>
        <th>Price</th>
        <th>Quantity</th>
        <th></th>
    </thead>
    <tbody>
        @for (product of productService.allProducts(); track product.id) {
        <tr>
            <td>
                {{ product.id }}
            </td>
            <td>
                
                {{ product.name }}
            </td>
            <td>
                {{ product.price }}
                
            </td>
            <td>
                <!-- @if(product.qty) {
                    <button class="btn btn-success">Selected</button>                
                }
                @else {
                    <button class="btn btn-danger">Not Selected</button>                
                } -->
                  <button class="btn" [ngClass]="{'btn-success': product.qty, 'btn-danger': !product.qty}" (click)="productService.toggleSelected(product.id)">{{ product.qty ? 'Selected' : 'Not Selected' }}</button>      
            </td>
            <td>
                <button (click)="productService.deleteProduct(product.id)" class="btn btn-outline-danger">Delete</button>
            </td>
        </tr>
    }
        
    </tbody>
</table>
